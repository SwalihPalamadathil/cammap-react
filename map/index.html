<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1220">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Muhammed Swalih P">

    <!-- Primary Title & Description -->
    <title>CamMap — EMEA College Interactive Campus Map & Route Finder</title>
    <meta name="description" content="Interactive vector campus map for EMEA College. Search campus locations, select starting points and destinations, and view optimal walking routes.">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cammap-react.vercel.app/map/">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="/map/logo1.png">
    <link rel="apple-touch-icon" href="/map/logo1.png">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CamMap">
    <meta property="og:title" content="CamMap — EMEA College Interactive Campus Map">
    <meta property="og:description" content="Explore EMEA College with the interactive vector campus map and shortest-path walking route finder.">
    <meta property="og:url" content="https://cammap-react.vercel.app/map/">
    <meta property="og:image" content="https://cammap-react.vercel.app/emea.png">
    <meta property="og:image:alt" content="CamMap EMEA College Interactive Campus Map">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CamMap — EMEA College Interactive Campus Map">
    <meta name="twitter:description" content="Explore EMEA College with the interactive vector campus map and shortest-path walking route finder.">
    <meta name="twitter:image" content="https://cammap-react.vercel.app/emea.png">

    <!-- Preconnect & Preload Critical Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/map/logo1.png" type="image/png" fetchpriority="high">
    
    <!-- Google Fonts: Geist & Geist Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CamMap Interactive Campus Map",
      "applicationCategory": "NavigationApplication",
      "operatingSystem": "All modern web browsers",
      "url": "https://cammap-react.vercel.app/map/",
      "description": "Interactive vector map and walking route engine for EMEA College of Arts and Science.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "creator": {
        "@type": "Person",
        "name": "Muhammed Swalih P"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/map/main.jsx"></script>
</body>
</html>
